name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    name: Publish plugin source
    if: github.event.pull_request.merged == true
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    concurrency:
      group: release-main
      queue: max
    steps:
      - name: Check out trusted release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: python3 scripts/release/publish.py
