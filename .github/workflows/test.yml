name: Test

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Go (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: golang:1.27.4-trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and test natively
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          make build test
      - name: Check module and vendor consistency
        if: matrix.arch == 'amd64'
        run: |
          go mod tidy
          make vendor
          git diff --exit-code -- go.mod go.sum vendor
          test -z "$(git ls-files --others --exclude-standard -- vendor)"
      - name: Lint
        if: matrix.arch == 'amd64'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test in Yaegi
        if: matrix.arch == 'amd64'
        run: |
          go install github.com/traefik/yaegi/cmd/yaegi@v0.16.3
          make yaegi_test

  smoke:
    name: Traefik smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test in Traefik
        run: bash scripts/smoke-test.sh
