version: "2"

run:
  timeout: 3m

linters:
  exclusions:
    rules:
      - linters: [staticcheck]
        text: '^ST1003: should not use underscores in package names'
      - linters: [staticcheck]
        text: '^SA1019: (net/)?http\.CloseNotifier has been deprecated'

formatters:
  enable: [gofmt]
