displayName: Response Body Rewrite

summary: Rewrite HTTP response bodies using regular expressions.

type: middleware

import: github.com/michibiki-io/traefik-plugin-rewritebody

testData:
  lastModified: true
  rewrites:
    - regex: "bar"
      replacement: "foo"
  monitoring:
    types:
      - text/plain
    methods:
      - GET
    checkMimeAccept: true
    checkMimeContentType: true
    checkAcceptEncoding: true
    checkContentEncoding: true
