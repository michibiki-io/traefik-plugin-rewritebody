services:
  traefik:
    build:
      context: fixtures
      dockerfile: smoke.Dockerfile
      target: traefik
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/rules-rewrite-body.yaml
      - --experimental.localplugins.rewrite-body.modulename=github.com/michibiki-io/traefik-plugin-rewritebody
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./rules-rewrite-body.yaml:/rules-rewrite-body.yaml:ro
      - .:/plugins-local/src/github.com/michibiki-io/traefik-plugin-rewritebody:ro

  whoami:
    build:
      context: fixtures
      dockerfile: smoke.Dockerfile
      target: whoami
    command: ["-name", "bar"]
