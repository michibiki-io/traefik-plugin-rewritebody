# Template for configuration

http:
  routers:
    whoami:
      rule: Host(`whoami.localhost`)
      entryPoints: [web]
      service: whoami
      middlewares: [compress, rewrite-body]
  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://whoami
  middlewares:
    compress:
      compress:
        includedContentTypes:
          - application/json
          - text/html
          - text/plain
        minResponseBodyBytes: 1
    rewrite-body:
      plugin:
        rewrite-body:
          lastModified: true
          rewrites:
            - regex: "bar"
              replacement: "foo"
          monitoring:
            types:
              - text/plain
            methods:
              - GET
            checkMimeAccept: true
            checkMimeContentType: true
            checkAcceptEncoding: true
            checkContentEncoding: true
